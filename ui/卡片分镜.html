<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pomo · 十张卡片，十种漫画表达</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4e9;color:#171717;font-family:"Microsoft YaHei",Arial,sans-serif}header{padding:35px 4vw 25px;border-bottom:2px solid #171717;display:flex;align-items:end;justify-content:space-between;gap:20px}.logo{font:900 italic 34px Arial;letter-spacing:-2px;margin-bottom:15px}h1{font-size:clamp(23px,2.3vw,40px);font-weight:900;margin:0 0 12px;transform:rotate(-1deg)}p{font-size:12px;color:#716673;line-height:1.9;margin:0}a{color:inherit}.cta{display:inline-block;background:#ffe76a;border:2px solid #171717;box-shadow:4px 4px 0 #171717;padding:13px 20px;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:35px 23px;padding:35px 4vw 50px}.item h2{font-size:13px;line-height:1.8;margin:0 0 5px}.item h2 span{font:900 italic 15px Arial;background:#ffe76a;border:1px solid #171717;padding:2px 5px;margin-right:8px;display:inline-block;transform:rotate(-4deg)}.item p{font-size:10px;margin-bottom:12px}.image{display:block;border:2px solid #171717;box-shadow:4px 5px 0 #171717;background:#faf7ef}.image img{width:100%;height:auto;display:block}.footer{border-top:2px solid #171717;padding:22px 4vw;font-size:11px;color:#746776}.item:nth-child(3n+2) h2 span{background:#a6d8ff}.item:nth-child(3n) h2 span{background:#ffbfcd}@media(max-width:1200px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:25px 16px}header{display:block}.cta{margin-top:17px}}@media(max-width:410px){.grid{grid-template-columns:1fr;padding:28px 7vw}.item{max-width:390px;margin:auto}}</style></head><body><header><div><div class="logo">pomo.</div><h1>十张卡片，十种漫画表达。</h1><p>同一本漫画里的不同页：统一墨线与滑动，每页有自己的场景和构图。</p></div><a class="cta" href="../prototype/index.html">打开交互，逐张翻看 ↗</a></header><main class="grid" id="grid"></main><footer class="footer">pomo / 卡片分镜设计 · 右划下一张，左划上一张 · 首尾循环</footer><script>const cards=[['work','赚取时间','日历页 · 工作场景'],['save','储蓄时间','硬币章 · 积累场景'],['rice','大米','撕口收据 · 日常补给'],['milk','纯牛奶','包装标签 · 早餐场景'],['egg','鸡蛋','椭圆印章 · 食材场景'],['apple','苹果','悬挂价签 · 水果摊'],['noodles','面条','对话气泡 · 热汤面'],['water','饮用水','水花字框 · 清凉场景'],['laundry','洗衣液','计数窗口 · 洗衣日常'],['tissue','抽纸','虚线优惠券 · 家庭用品']];document.querySelector('#grid').innerHTML=cards.map(([type,title,sub],i)=>{const src=`screens/card-${String(i+1).padStart(2,'0')}-${type}.png`;return `<article class="item"><h2><span>${String(i+1).padStart(2,'0')}</span>${title}</h2><p>${sub}</p><a class="image" href="${src}" aria-label="查看${title}大图"><img src="${src}" alt="${title}漫画卡片"></a></article>`}).join('');</script></body></html>
